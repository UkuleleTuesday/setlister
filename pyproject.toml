[project]
name = "ut-requests"
version = "0.1.0"
description = "Ukulele Tuesday whiteboard song request parser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2",
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "python-multipart>=0.0.20",
    "httpx>=0.28",
    "pillow>=11",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "google-genai>=1.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
]

[project.scripts]
ut-requests = "utrequests.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-timeout>=2.3",
    "ruff>=0.9",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utrequests*"]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "live: hits the real Gemini API and GCS; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
