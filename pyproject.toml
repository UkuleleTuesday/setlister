[project]
name = "setlister"
version = "0.1.0"
description = "Ukulele Tuesday whiteboard song request parser"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.2",
    "functions-framework>=3.8",
    "httpx>=0.28",
    "pillow>=11",
    "rapidfuzz>=3.9",
    "unidecode>=1.3",
    "google-genai>=2.17.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.10",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-gcp-trace>=1.14.0",
    "opentelemetry-propagator-gcp>=1.14.0",
]

[project.scripts]
setlister = "utrequests.cli:cli"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-timeout>=2.3",
    "ruff>=0.16.1",
]

[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["utrequests*"]

[tool.pytest.ini_options]
timeout = 30
markers = [
    "live: hits the real Gemini API and GCS; deselected by default",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
