version: 2

# Nothing here bumps itself otherwise: the UI deps are caret ranges frozen by a
# committed lockfile, and the workflow actions are pinned by tag or SHA.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: monthly
    groups:
      # One PR for the build toolchain; runtime deps (firebase, lucide) come
      # separately, since those are the ones that ship to the room's phones.
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
