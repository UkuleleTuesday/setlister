name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest

  deploy-function:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token exchanged for GCP credentials
    steps:
      - uses: actions/checkout@v4
      - name: Load deploy config
        uses: falti/dotenv-action@v1.1.4
        with:
          path: .env.deploy
          export-variables: true
          keys-case: bypass
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Generate requirements.txt for the function build
        run: >
          uv export --no-emit-project --no-dev --format requirements-txt
          > utrequests/requirements.txt
      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy "$API_FUNCTION_NAME" \
            --gen2 \
            --region "$GCP_REGION" \
            --runtime python312 \
            --source utrequests \
            --entry-point setlister_api \
            --trigger-http \
            --allow-unauthenticated \
            --memory 512Mi \
            --timeout 120s \
            --concurrency 1 \
            --max-instances 1 \
            --set-env-vars "GCP_PROJECT=$GCP_PROJECT_ID,GCP_LOCATION=$GCP_VERTEX_LOCATION,CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
      - name: Smoke check
        run: |
          URL=$(gcloud functions describe "$API_FUNCTION_NAME" \
            --region "$GCP_REGION" --format='value(serviceConfig.uri)')
          echo "Function URL: $URL"
          # 11 retries × 5 s = up to ~55 s for the function to become ready
          curl -fsS --retry 11 --retry-delay 5 --retry-all-errors \
            "$URL/api/editions" | grep -q '"current"'

  deploy-rules:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token exchanged for GCP credentials
    steps:
      - uses: actions/checkout@v4
      - name: Load deploy config
        uses: falti/dotenv-action@v1.1.4
        with:
          path: .env.deploy
          export-variables: true
          keys-case: bypass
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project "$GCP_PROJECT_ID"

  build-ui:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Build UI
        run: npm run build
        working-directory: ui

  deploy-ui:
    needs: [test, build-ui]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the gh-pages branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Build UI
        run: npm run build
        working-directory: ui
      - name: Deploy UI to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ui/dist
