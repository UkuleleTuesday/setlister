name: CI

on:
  pull_request:
    branches: [main]
    # `closed` is needed so the PR-preview cleanup job runs when a PR is
    # merged or closed and removes its pr-preview/pr-<N>/ directory.
    types: [opened, reopened, synchronize, closed]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Install dependencies
        run: uv sync --locked --dev
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Run tests
        run: uv run pytest

  deploy-function:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token exchanged for GCP credentials
    steps:
      - uses: actions/checkout@v4
      - name: Load deploy config
        uses: falti/dotenv-action@v1.1.4
        with:
          path: .env.deploy
          export-variables: true
          keys-case: bypass
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
      - name: Generate requirements.txt for the function build
        run: >
          uv export --no-emit-project --no-dev --format requirements-txt
          > utrequests/requirements.txt
      - name: Deploy Cloud Function
        run: |
          gcloud functions deploy "$API_FUNCTION_NAME" \
            --gen2 \
            --region "$GCP_REGION" \
            --runtime python312 \
            --source utrequests \
            --entry-point setlister_api \
            --trigger-http \
            --allow-unauthenticated \
            --memory 512Mi \
            --timeout 120s \
            --concurrency 1 \
            --max-instances 1 \
            --set-env-vars "GCP_PROJECT=$GCP_PROJECT_ID,GCP_LOCATION=$GCP_VERTEX_LOCATION,CORS_ALLOWED_ORIGINS=$CORS_ALLOWED_ORIGINS"
      - name: Smoke check
        run: |
          URL=$(gcloud functions describe "$API_FUNCTION_NAME" \
            --region "$GCP_REGION" --format='value(serviceConfig.uri)')
          echo "Function URL: $URL"
          # 11 retries × 5 s = up to ~55 s for the function to become ready
          curl -fsS --retry 11 --retry-delay 5 --retry-all-errors \
            "$URL/api/editions" | grep -q '"current"'

  deploy-rules:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # mint the GitHub OIDC token exchanged for GCP credentials
    steps:
      - uses: actions/checkout@v4
      - name: Load deploy config
        uses: falti/dotenv-action@v1.1.4
        with:
          path: .env.deploy
          export-variables: true
          keys-case: bypass
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
      - name: Deploy Firestore rules
        run: npx --yes firebase-tools deploy --only firestore:rules --project "$GCP_PROJECT_ID"

  build-ui:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Build UI
        run: npm run build
        working-directory: ui

  test-ui:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      # The Firestore emulator is a Java process the CLI downloads on first run.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      # firestore.rules is the app's entire access-control layer (the browser
      # writes Firestore directly), so the suite runs against the emulator —
      # a rules regression must fail CI, not production.
      - name: Run UI tests against the Firestore emulator
        run: npm run test:emulator
        working-directory: ui

  deploy-ui:
    # deploy-rules is in here for ORDERING, not for testing: firestore.rules uses
    # a closed hasOnly key set, so a bundle that writes a field the live rules
    # don't know about has its whole write rejected. Rules must land first. Both
    # jobs used to hang off `test` alone and raced; on the run that added
    # `requestsOpen` the UI went out 12 seconds ahead of the rules.
    needs: [test, test-ui, build-ui, deploy-rules]
    # Runs for the production deploy (push to main) and for PR previews
    # (opened/reopened/synchronize). The `closed` event is handled by the
    # cleanup-ui-preview job instead.
    #
    # `!cancelled()` is load bearing: deploy-rules is main-only, and a SKIPPED
    # job in `needs` skips its dependents by default, which would silently stop
    # every PR preview. It also discards the implicit "all needs succeeded"
    # gate, so each dependency is re-asserted below by hand — without those
    # lines a failing test-ui would no longer block a deploy.
    # (Hyphenated job ids need index syntax: `needs.test-ui` parses the hyphen
    # as subtraction.)
    if: >-
      !cancelled() &&
      needs.test.result == 'success' &&
      needs['test-ui'].result == 'success' &&
      needs['build-ui'].result == 'success' &&
      (needs['deploy-rules'].result == 'success' ||
       needs['deploy-rules'].result == 'skipped') &&
      github.event.action != 'closed' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
       github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the gh-pages branch
      pull-requests: write # posts/updates the preview URL comment on PRs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        run: npm ci
        working-directory: ui
      - name: Build UI
        run: npm run build
        working-directory: ui
      # Production deploy: publish ui/dist to the gh-pages root. clean-exclude
      # keeps the pr-preview/ subtree so open PR previews survive a main deploy.
      - name: Deploy UI to GitHub Pages (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ui/dist
          clean-exclude: pr-preview/
      # PR preview: publish ui/dist to pr-preview/pr-<N>/ on gh-pages and post
      # a sticky comment with the preview URL.
      - name: Deploy PR preview (PRs only)
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ui/dist

  cleanup-ui-preview:
    name: Cleanup UI Preview
    # When a PR is merged or closed, remove its pr-preview/pr-<N>/ directory
    # from gh-pages and update the preview comment.
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the gh-pages branch
      pull-requests: write # updates the preview URL comment
    steps:
      - uses: actions/checkout@v4
      - name: Remove PR preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ui/dist
