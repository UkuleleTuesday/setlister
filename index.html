<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT Request Board Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🎶 Whiteboard of Wishes</h1>
    <p class="subtitle">Snap the request board, get the setlist.</p>
  </header>

  <main>
    <section id="capture">
      <label class="field">
        <span>Songbook edition</span>
        <select id="edition"><option value="current" selected>current</option></select>
      </label>

      <label class="camera-button" for="photo-input">📷 Take or choose a photo</label>
      <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>

      <div id="preview-wrap" class="preview-wrap" hidden>
        <img id="preview" alt="">
        <div id="scan-overlay" class="scan-overlay" hidden aria-hidden="true">
          <div class="scan-beam"></div>
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
          <div class="scan-status"><span class="dot"></span>Reading the board…</div>
        </div>
      </div>
      <div id="error" class="error" hidden></div>
    </section>

    <section id="results" hidden>
      <h2>Requests</h2>
      <p id="edition-note" class="note"></p>
      <ul id="rows"></ul>
      <label class="note toggle">
        <input type="checkbox" id="include-crossed"> include crossed-out rows in export
      </label>
      <div class="actions">
        <button id="copy">📋 Copy list</button>
        <button id="download">⬇️ Download JSON</button>
      </div>
    </section>
  </main>

  <datalist id="catalogue-list"></datalist>
  <script src="app.js"></script>
</body>
</html>
