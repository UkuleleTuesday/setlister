<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UT Request Board Parser</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="settings-toggle" class="settings-toggle" type="button"
            aria-label="Settings" aria-expanded="false" aria-controls="settings-panel">⚙️</button>
    <h1>🎶 Whiteboard of Wishes</h1>
    <p class="subtitle">Snap the request board, get the setlist.</p>

    <div id="settings-panel" class="settings-panel" role="dialog" aria-label="Settings" hidden>
      <label class="field">
        <span>Songbook edition</span>
        <select id="edition"><option value="current" selected>current</option></select>
      </label>
      <label class="field">
        <span>Model</span>
        <select id="model">
          <option value="" selected>default (gemini-2.5-flash)</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
          <option value="gemini-2.5-flash-lite">gemini-2.5-flash-lite (faster)</option>
        </select>
      </label>
      <label class="field toggle">
        <input type="checkbox" id="disable-thinking" checked>
        <span>Disable model thinking (faster)</span>
      </label>
      <label class="field toggle">
        <input type="checkbox" id="send-catalogue" checked>
        <span>Send songbook to model (better handwriting reads)</span>
      </label>
      <label class="field toggle">
        <input type="checkbox" id="show-suggestions">
        <span>Show alternative suggestions</span>
      </label>
      <label class="field toggle">
        <input type="checkbox" id="include-crossed">
        <span>Include crossed-out rows in export</span>
      </label>
      <label class="field">
        <span>Max image edge (px)</span>
        <input type="number" id="max-image-edge" min="256" max="4096" step="128"
               placeholder="1600">
      </label>
      <div class="field">
        <span>Export setlist</span>
        <div class="actions">
          <button id="copy">📋 Copy list</button>
          <button id="download">⬇️ Download JSON</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <!-- The setlist you're building is the primary object: it accumulates tunes
         from photo scans (via the review sheet) and manual searches, in the
         order you'll play them. -->
    <section id="setlist">
      <div class="setlist-head">
        <h2>Your setlist</h2>
        <button id="clear" class="link-button" type="button" hidden>Start over</button>
      </div>
      <ul id="setlist-rows"></ul>
      <p id="setlist-empty" class="note">No tunes yet — snap the board or add one below.</p>
      <p id="edition-note" class="note"></p>
    </section>

    <!-- Two ways to add tunes: type a song name, or snap the whiteboard. -->
    <section id="add">
      <div id="manual-add" class="manual-add"></div>
      <div class="or-divider"><span>or</span></div>
      <label class="camera-button" for="photo-input">📷 Snap the request board</label>
      <input id="photo-input" type="file" accept="image/*" capture="environment" hidden>

      <div id="preview-wrap" class="preview-wrap" hidden>
        <img id="preview" alt="">
        <div id="scan-overlay" class="scan-overlay" hidden aria-hidden="true">
          <div class="scan-beam"></div>
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
          <div class="scan-status"><span class="dot"></span>Reading the board…</div>
        </div>
      </div>
      <div id="error" class="error" hidden></div>
    </section>

    <!-- Review sheet: scanned rows land here to be validated/corrected before
         they merge into the setlist. Hidden until a scan completes. -->
    <section id="review" hidden>
      <h2>Review scan</h2>
      <p class="note">Fix any misreads, drop what you don't want, then add them to your setlist.</p>
      <ul id="review-rows"></ul>
      <div class="actions">
        <button id="review-confirm">➕ Add to setlist</button>
        <button id="review-cancel" class="secondary">Cancel</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
